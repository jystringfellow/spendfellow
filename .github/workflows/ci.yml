name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      PLAID_CLIENT_ID: ci-placeholder-client-id
      PLAID_ENV: sandbox
      PLAID_SANDBOX_SECRET: ci-placeholder-sandbox-secret
      PLAID_REDIRECT_URI: http://localhost:3000/accounts
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check
